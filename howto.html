<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marqit How-To Videos</title>
<style>
:root{--bg:#F1F2F5;--panel:#fff;--fg:#16181D;--muted:#646A75;--line:#E1E3E8;--accent:#2F55E8;--accent-fg:#fff;--font:Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1115;--panel:#1A1D23;--fg:#F0F2F5;--muted:#979EAA;--line:#2B3039;--accent:#6C8BFF;--accent-fg:#0B0E14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1115;--panel:#1A1D23;--fg:#F0F2F5;--muted:#979EAA;--line:#2B3039;--accent:#6C8BFF;--accent-fg:#0B0E14;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;margin:0;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1{font-size:24px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:18px;margin:0 0 4px}
video{width:100%;max-height:70vh;background:#000;border-radius:10px;margin:12px 0;display:block}
a.btn{display:block;text-align:center;font-weight:700;text-decoration:none;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:14px;font-size:16px}
</style></head><body>
<div class="wrap">
<div><h1>Marqit how-to videos</h1><p class="sub">Each one is under a minute. Watch it, then open the tool.</p></div>

<div class="card"><h2>Make a post (photo + headline)</h2><p class="sub">For Instagram photo posts.</p>
<video controls playsinline preload="metadata" poster="howto-post.jpg" src="howto-post.mp4"></video>
<a class="btn" href="/post">Open the Post Maker</a></div>

<div class="card"><h2>Make a video (captions + watermark)</h2><p class="sub">For Reels and TikTok. Use Safari on an iPhone.</p>
<video controls playsinline preload="metadata" poster="howto-video.jpg" src="howto-video.mp4"></video>
<a class="btn" href="/video">Open the Video Maker</a></div>
</div>
</body></html>
