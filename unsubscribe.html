<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Marqit</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#17191D; --ink-soft:#4B4E55; --paper:#FFFFFF; --panel:#F4F4F1; --line:#E4E3DD; --yes:#1C7A4D; --no:#B23A2E; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;text-align:center;}
  .word{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;}
  .word span{color:var(--yes);}
  h1{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:24px;margin-top:20px;}
  p{margin-top:12px;font-size:14.5px;color:var(--ink-soft);}
  a{color:var(--ink);font-weight:600;}
</style>
</head>
<body>

<div class="card">
  <div class="word">Marqit<span>.</span></div>
  <h1 id="status-heading">Unsubscribing…</h1>
  <p id="status-text">One second.</p>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://ivapcztkasjfetntkzxy.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_S1DZQXDDpffETdJh2xJONQ_QSNjnunn';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var params = new URLSearchParams(window.location.search);
  var uid = params.get('uid');
  var token = params.get('token');
  var heading = document.getElementById('status-heading');
  var text = document.getElementById('status-text');

  // FIXED: unsubscribe links now carry a signed token alongside uid. A link
  // missing either piece can't be a real Marqit email link, so don't even
  // attempt the call -- just point them to their profile instead.
  if(!uid || !token){
    heading.textContent = 'Missing link details';
    text.textContent = 'This unsubscribe link looks incomplete. You can also turn this off from your profile on the site.';
    return;
  }

  sb.rpc('unsubscribe_from_resolve_email', { p_user_id: uid, p_token: token }).then(function(res){
    if(res.error){
      heading.textContent = 'Something went wrong';
      text.innerHTML = 'Could not process this automatically. You can also turn it off from your profile at <a href="https://playmarqit.com">playmarqit.com</a>.';
      return;
    }
    heading.textContent = 'You\u2019re unsubscribed';
    text.innerHTML = 'You won\u2019t get daily results emails anymore. You can turn it back on anytime from your profile at <a href="https://playmarqit.com">playmarqit.com</a>.';
  });
})();
</script>

</body>
</html>
