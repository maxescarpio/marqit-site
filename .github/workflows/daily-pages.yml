name: Daily results pages
on:
  schedule:
    - cron: "30 9 * * *"   # ~4:30 AM Eastern, after the previous day settles
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gen-daily.mjs
      - name: Commit changes
        run: |
          git config user.name "marqit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily sitemap.xml feed.xml
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update daily results pages"
            git push
            # Tell Bing / DuckDuckGo about the new day (IndexNow)
            D=$(TZ=America/New_York date -d yesterday +%F)
            curl -s -o /dev/null "https://api.indexnow.org/indexnow?url=https://playmarqit.com/daily/$D&key=a13d9d20b1491bdaf94f57ac8767fe40&keyLocation=https://playmarqit.com/a13d9d20b1491bdaf94f57ac8767fe40.txt" || true
          fi
