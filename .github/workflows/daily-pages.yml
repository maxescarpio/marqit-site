name: Daily results pages
on:
  schedule:
    - cron: "30 9 * * *"   # ~4:30 AM Eastern, after the previous day settles
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gen-daily.mjs
      - name: Commit changes
        run: |
          git config user.name "marqit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily sitemap.xml feed.xml
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update daily results pages"
            git push
          fi
